<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#00d97a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/plane-sound-logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plane Sound" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Plane Sound is an aircraft audio warning tool for film sound departments."
    />
    <title>Plane Sound</title>
    <!-- v30: strict verified mic lookup; backend geocode/aircraft proxy support -->

    <link rel="icon" type="image/png" href="assets/plane-sound-logo.png" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="privacy-link"><a href="privacy.html">Privacy</a></div>
      <div class="meta">
        <span id="metaLoc">no location</span><span id="metaApi">â€”</span>
      </div>
      <div class="app-logo-wrap">
        <img
          class="app-logo"
          src="assets/plane-sound-logo.png"
          alt="Plane Sound"
        />
      </div>
      <div id="err" class="panel err hidden"></div>

      <div class="radar-wrap">
        <canvas id="radar"></canvas>
        <div
          id="selectedMicList"
          class="selected-mic-list"
          aria-label="Selected microphones"
        ></div>
        <button
          id="audioSourceBadge"
          class="audio-source-badge unavailable"
          type="button"
          aria-label="Audio source"
        >
          DEVICE MIC
        </button>
      </div>

      <div class="tabs">
        <button id="tabMics" class="tab">Mics</button>
        <button id="tabAircraft" class="tab">Aircraft</button>
        <button id="tabLocation" class="tab">Location</button>
      </div>

      <div id="micPanel" class="panel hidden">
        <div class="sblock">
          <div id="chipGrid" class="chips"></div>
        </div>
        <div class="sblock mic-spec-editor">
          <button id="micSpecAddToggle" class="btn" style="width: 100%">
            Add Mic
          </button>

          <div id="micSpecForm" class="hidden" style="margin-top: 10px">
            <input id="micSpecEditId" type="hidden" />

            <input
              id="specManufacturer"
              class="input"
              placeholder="Manufacturer"
            />
            <input id="specModel" class="input" placeholder="Model" />
            <input
              id="specTransducer"
              class="input"
              placeholder="Transducer type"
            />
            <input
              id="specPattern"
              class="input"
              placeholder="Pickup pattern"
            />
            <input
              id="specFreq"
              class="input"
              placeholder="Frequency response"
            />
            <input
              id="specSensitivity"
              class="input"
              placeholder="Sensitivity"
            />
            <button
              id="micSpecSave"
              class="btn primary"
              style="width: 100%; margin-top: 8px"
            >
              Save Mic Specs
            </button>
            <button
              id="micSpecCancel"
              class="btn"
              style="width: 100%; margin-top: 8px"
            >
              Cancel
            </button>
            <div id="micSpecMsg" class="msg hidden"></div>
          </div>
        </div>

        <div class="sblock range-read" id="rangeRead"></div>
      </div>

      <div id="aircraftPanel" class="panel hidden">
        <div class="title">Aircraft List</div>
        <div id="aircraftList" class="planeList"></div>
      </div>

      <div id="locationPanel" class="panel hidden">
        <div class="row">
          <input
            id="searchInput"
            class="input"
            placeholder="Address, city, postal codeâ€¦"
          /><button id="searchBtn" class="btn primary">Search</button>
        </div>
        <div id="searchMsg" class="msg hidden"></div>
        <div id="results" class="results hidden"></div>
        <div class="or">or</div>
        <button id="gpsBtn" class="btn green" style="width: 100%">
          Use Current Location
        </button>
        <div id="gpsMsg" class="msg hidden"></div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.constants.js"></script>
    <script src="app.data.js"></script>
    <script src="app.utils.js"></script>
    <script src="app.aircraft-db.js"></script>
    <script src="app.propagation.js"></script>
    <script src="app.weather.js"></script>
    <script src="app.audio-monitor.js"></script>
    <script src="app.audio-source.js?v=audio-cycle-current-1"></script>
    <script src="app.threshold.js"></script>
    <script src="app.acoustics.js"></script>
    <script src="app.aircraft.js"></script>
    <script src="app.mics.js"></script>
    <script src="app.selected-mics.js"></script>
    <script src="app.connection.js"></script>
    <script src="app.render.js"></script>
    <script src="app.radar.js"></script>
    <script src="app.location.js"></script>
    <script src="app.loop.js"></script>
    <script src="app.mic-specs.js"></script>
    <script src="app.search.js"></script>
    <script src="app.feed.js"></script>
    <script src="app.js"></script>
  </body>
</html>

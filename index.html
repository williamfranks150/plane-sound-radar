<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030c08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Plane Sound is an aircraft audio warning tool for film sound departments.">
<title>Plane Sound</title>
<!-- v30: strict verified mic lookup; backend geocode/aircraft proxy support -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23030c08'/%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%2300d97a' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='20' fill='none' stroke='%23d4a017' stroke-width='3' stroke-dasharray='5 5'/%3E%3Cpath d='M50 50 L80 32' stroke='%2300ff85' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="meta"><span id="metaLoc">no location</span><span id="metaApi">—</span></div>
  <div class="app-logo-wrap"><img class="app-logo" src="assets/plane-sound-logo.png" alt="Plane Sound"></div>

  <div id="banner" class="banner">
    <div id="headline" class="headline">NO DATA</div>
    <div class="countBox">
      <div id="bigCount" class="bigCount">—</div>
      <div id="countLabel" class="countLabel"></div>
    </div>
    <div class="statusLine">
      <span id="statusLeft">Set location</span>
      <span id="statusRight">—</span>
    </div>
  </div>

  <div id="err" class="panel err hidden"></div>

  <div class="radar-wrap"><canvas id="radar"></canvas></div>

  <div class="tabs">
    <button id="tabMics" class="tab">Mics</button>
    <button id="tabAircraft" class="tab">Aircraft</button>
    <button id="tabLocation" class="tab">Location</button>
  </div>

  <div id="micPanel" class="panel hidden">
    <div class="sblock">
      <div id="chipGrid" class="chips"></div>
    </div>
    <div class="sblock manual-mic">
      <div class="row custom-row">
        <input id="customMicName" class="input" placeholder="Mic model">
        <button id="customMicBtn" class="btn">Search</button>
      </div>
      <div id="customMicMsg" class="msg hidden"></div>
    </div>

    <div class="sblock mic-spec-editor">
      <button id="micSpecAddToggle" class="btn" style="width:100%">Add Mic</button>

      <div id="micSpecForm" class="hidden" style="margin-top:10px">
        <input id="micSpecEditId" type="hidden">

        <input id="specManufacturer" class="input" placeholder="Manufacturer">
        <input id="specModel" class="input" placeholder="Model">
        <input id="specTransducer" class="input" placeholder="Transducer type">
        <input id="specPattern" class="input" placeholder="Pickup pattern">
        <input id="specFreq" class="input" placeholder="Frequency response">
        <input id="specSensitivity" class="input" placeholder="Sensitivity">
<button id="micSpecSave" class="btn primary" style="width:100%;margin-top:8px">Save Mic Specs</button>
        <button id="micSpecCancel" class="btn" style="width:100%;margin-top:8px">Cancel</button>
        <div id="micSpecMsg" class="msg hidden"></div>
      </div>
    </div>

    <div class="sblock range-read" id="rangeRead"></div>
  </div>

  <div id="aircraftPanel" class="panel hidden">
    <div class="title">Aircraft List</div>
    <div id="aircraftList" class="planeList"></div>
  </div>

  <div id="locationPanel" class="panel hidden">
    <div class="row"><input id="searchInput" class="input" placeholder="Address, city, postal code…"><button id="searchBtn" class="btn primary">Search</button></div>
    <div id="searchMsg" class="msg hidden"></div>
    <div id="results" class="results hidden"></div>
    <div class="or">or</div>
    <button id="gpsBtn" class="btn green" style="width:100%">Use Current Location</button>
    <div id="gpsMsg" class="msg hidden"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.constants.js"></script>
<script src="app.data.js"></script>
<script src="app.utils.js"></script>
<script src="app.aircraft.js"></script>
<script src="app.mics.js"></script>
<script src="app.connection.js"></script>
<script src="app.render.js"></script>
<script src="app.radar.js"></script>
<script src="app.js"></script>
</body>
</html>
